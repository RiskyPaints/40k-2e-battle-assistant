<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Warhammer 40,000 2nd Edition Battle Assistant</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <header>
            <h1>WARHAMMER 40,000</h1>
            <h2>SECOND EDITION</h2>
            <p>Battle Assistant</p>
        </header>

        <section class="menu">

            <button id="newBattleButton">
                NEW BATTLE
            </button>

            <button id="missionsButton">
                MISSIONS
            </button>

            <button id="diceButton">
                DICE
            </button>

        </section>

        <section id="content">
            <h2>Ready for battle?</h2>
            <p>Select an option above.</p>
        </section>

    </main>

    <script src="data/missions.js"></script>
    <script src="app.js"></script>

</body>
</html>
